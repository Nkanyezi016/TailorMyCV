<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TailorMyCV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#f7f6f9; --card:#fff; --ink:#241d2d; --muted:#645c70;
  --line:#e3dfe9; --accent:#5e3b92; --accent-light:#eee7fa;
  --sidebar:#21182d; --butter:#fff0c2;
  --display:system-ui,sans-serif; --body:system-ui,sans-serif;
  color-scheme:light;
}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,select,textarea {font:inherit;color:inherit}
h1,h2,h3,p {margin:0}
h1,h2,h3 {line-height:1.2}
h1 {font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.035em}
h2 {font-size:1.2rem}
:focus-visible {outline:2px solid #8c60c2;outline-offset:3px}
.workspace {min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}
.sidebar {position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:32px;padding:24px 16px;background:var(--sidebar);color:#f8f2ff}
.brand {display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:750;padding-inline:6px}
.logo {display:grid;place-items:center;width:34px;height:34px;border-radius:7px;background:#c8a5ef;color:#21182d;font-size:.7rem;letter-spacing:.04em}
.sidebar nav {display:grid;gap:4px}
.nav-item {width:100%;padding:10px 12px;border:0;border-left:3px solid transparent;border-radius:5px;text-align:left;background:transparent;color:#e2d7ee;font-weight:650;cursor:pointer}
.nav-item:hover {background:#382747}
.nav-item[aria-current=page] {background:#433056;border-left-color:#c49ded;color:white}
.storage-note {margin-top:auto;padding:0 8px;color:#d0c2dd;font-size:.82rem}
.topbar {padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.breadcrumb {display:flex;flex-wrap:wrap;gap:9px;color:var(--muted)}
.breadcrumb strong {color:var(--ink)}
main {width:100%;max-width:1250px;margin:auto;padding:clamp(18px,4vw,40px)}
.hero {margin-bottom:22px}
.hero p {max-width:68ch;margin-top:7px;color:var(--muted)}
.hero.job-hero {padding:22px 24px;background:#eee8f7;border:1px solid #e4dbef;border-radius:9px}
.card {min-width:0;background:var(--card);padding:clamp(16px,3vw,24px);border:1px solid var(--line);border-radius:9px}
.stack>*+* {margin-top:16px}
.row {display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2,.choice,.job-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.job-grid {grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
label.field {display:flex;flex-direction:column;gap:5px;font-weight:650}
input,select,textarea {width:100%;min-width:0;padding:9px 11px;border:1px solid #cbc4d4;border-radius:6px;background:white;font-weight:400}
input::placeholder,textarea::placeholder {color:var(--muted)}
textarea {min-height:90px;resize:vertical}
.btn {border:1px solid transparent;border-radius:6px;background:var(--accent);color:white;padding:9px 13px;font-weight:650;cursor:pointer}
.btn:hover {filter:brightness(.92)}
.btn.ghost,.btn.peach {background:#fff;border-color:#cbc4d4;color:var(--ink)}
.btn.danger {background:#fff5f6;border-color:#ebcbd0;color:#8b3044}
.btn.small {padding:6px 10px;font-size:.9rem}
.btn:disabled {opacity:.55;cursor:not-allowed}
.steps {display:flex;flex-wrap:wrap;gap:6px 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.dot,.step-tab {padding:8px 4px 9px;color:var(--muted);font-weight:650;border:0;border-bottom:2px solid transparent;background:none}
.step-tab {cursor:pointer}
.step-tab:disabled {cursor:default;color:#77707f}
.dot.on,.step-tab[aria-current=step] {border-color:var(--accent);color:var(--accent)}
.choice button {text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:18px;cursor:pointer}
.choice button:hover {border-color:var(--accent);background:#fcfaff}
.choice b {display:block;font-size:1.04rem;margin-bottom:4px}
.choice span,.hint {color:var(--muted)}
.section-head {display:flex;align-items:center;gap:12px}
.pill {display:inline-block;padding:2px 7px;border-radius:4px;font-size:.82rem;font-weight:650;background:var(--accent-light);color:#4f327a}
.entry,.saved {border:1px solid var(--line);border-radius:6px;padding:14px}
.entry+.entry {margin-top:12px}
.drop {display:block;border:1px dashed #9d85b9;border-radius:7px;padding:24px;text-align:center;background:#faf8fd;cursor:pointer}
.drop.over {background:var(--accent-light)}
.toast {position:fixed;right:16px;bottom:16px;z-index:5;background:var(--ink);color:white;padding:10px 14px;border-radius:6px;max-width:calc(100% - 32px)}
.theme-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.swatch {border:1px solid var(--line);border-radius:6px;padding:8px;background:white;cursor:pointer;text-align:left}
.swatch[aria-pressed=true] {border-color:var(--accent);outline:1px solid var(--accent)}
.swatch .chips {display:flex;height:20px;border-radius:3px;overflow:hidden;margin-bottom:5px}
.swatch .chips i {flex:1}
.cv {background:white;border:1px solid var(--line);border-radius:5px;padding:clamp(16px,4vw,38px);overflow-wrap:anywhere}
.cv header {padding:16px;margin:0 0 17px}
.cv h1 {font-size:clamp(1.5rem,3vw,2.15rem)}
.cv h2 {font-size:1.05rem;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid currentColor}
.cv .meta,.cv .sub {font-size:.9rem}
.cv .meta {margin-top:5px}
.cv .item {margin-bottom:12px}
.cv ul {margin:6px 0 0;padding-left:20px}
.cv .chip {display:inline-block;margin:3px 4px 3px 0;padding:2px 6px;border-radius:3px;font-size:.9rem}
.cv .hl {background:var(--butter)}
.t-blush header{background:#ffd9e4}.t-blush h2{color:#a53e6a}.t-blush .chip{background:#ffe9f0;color:#8a2f57}
.t-mint header{background:#c9f2e1}.t-mint h2{color:#1f7a5a}.t-mint .chip{background:#e0f8ee;color:#1f6a4f}
.t-lavender header{background:#dccffa}.t-lavender h2{color:#5b3fb5}.t-lavender .chip{background:#efe9ff;color:#4a2fa0}
.t-sky header{background:#cfe9ff}.t-sky h2{color:#2a6aa8}.t-sky .chip{background:#e6f3ff;color:#1f5a8a}
.saved-list {display:grid;gap:8px}
.saved,.saved .btns {display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.notice {padding:10px 13px;border-radius:5px;background:#fcf1d6;color:#61450d}
.profile-stats {margin:0}
.profile-stats div {display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.profile-stats dt {color:var(--muted)}
.profile-stats dd {margin:0;font-weight:650}
.match-list {margin:8px 0 0;padding-left:20px}
@media (max-width:900px) {.workspace{grid-template-columns:185px minmax(0,1fr)}.job-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px) {
  .workspace {display:block}
  .sidebar {position:static;height:auto;gap:10px;padding:12px 14px}
  .sidebar nav {display:flex;flex-wrap:wrap}
  .nav-item {width:auto;padding:6px 8px}
  .storage-note {display:none}
  .grid2,.choice {grid-template-columns:1fr}
  .theme-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="workspace">
  <aside class="sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">CV</span>TailorMyCV</div>
    <nav id="navRow" aria-label="Workspace"></nav>
    <p class="storage-note">Data stays in this browser</p>
  </aside>
  <div>
    <header class="topbar">
      <div class="breadcrumb"><span>Workspace</span><span aria-hidden="true">/</span><strong id="location"></strong></div>
      <button class="btn ghost small" id="backup" data-act="backup" hidden>Back up data</button>
    </header>
    <main id="app"></main>
  </div>
</div>
<script>
/* ---------- State & storage ---------- */
const KEY_USER = "tmcv.user.v1";
const KEY_CVS  = "tmcv.cvs.v1";
const KEY_PROFILE = "tmcv.profile.v1";
const THEMES = [
  {id:"blush",name:"Blush",c:["#ffd9e4","#ffe9f0","#a53e6a"]},
  {id:"mint",name:"Mint",c:["#c9f2e1","#e0f8ee","#1f7a5a"]},
  {id:"lavender",name:"Lavender",c:["#dccffa","#efe9ff","#5b3fb5"]},
  {id:"sky",name:"Sky",c:["#cfe9ff","#e6f3ff","#2a6aa8"]}
];
const blankProfile = () => ({
  name:"", email:"",
  contact:{ email:"", phone:"", location:"", links:"" },
  noEducation:false,
  education:[{ qual:"", institution:"", study:"", start:"", end:"", grades:"" }],
  certs:"",
  work:[],
  projects:[],
  skills:"",
  languages:"",
  awards:""
});
const state = {
  user: null,          // {name,email,startedWith}
  profile: blankProfile(),
  step: 0,             // wizard section index
  theme: "lavender",
  tailorJD: "",
  jobTitle: "",
  jobCompany: "",
  draftTitle: null,
  tailored: null,      // result of matching
  currentCv: null      // {id,title,theme,profile,mode,createdAt}
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
const app = () => $("#app");
const go = (fn) => { fn(); window.scrollTo(0,0); };

/* ---------- Helpers for profile fields ---------- */
const lines = s => String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
const emailRe = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
const phoneRe = /(\+?\d[\d\s().-]{7,}\d)/;
const linkRe  = /((?:https?:\/\/)?(?:www\.)?(?:linkedin\.com|github\.com|[a-z0-9-]+\.[a-z]{2,})\/[^\s,;|]*)/i;
const STOP = new Set("the and for with that this from your you are was were will have has had into over more able using use used who what when where which their they them our out all any can new work team role job about such also been being other than then there these those while within across per each well good strong experience years year skills skill need build preferred will provide ensure".split(" "));
function keywords(text){
  const counts = {};
  (String(text).toLowerCase().match(/[a-z][a-z+#.\-]{2,}/g) || []).forEach(w=>{
    const k = w.replace(/\.$/,"");
    if(!STOP.has(k) && k.length>2) counts[k]=(counts[k]||0)+1;
  });
  return counts;
}

/* ---------- CV text extraction (PDF via pdf.js, TXT/MD directly) ---------- */
async function readFileText(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".pdf")){
    if(!window.pdfjsLib) throw new Error("PDF reader did not load. Paste your CV text instead.");
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let out = "";
    for(let i=1;i<=pdf.numPages;i++){
      const c = await (await pdf.getPage(i)).getTextContent();
      out += c.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("") + "\n";
    }
    return out;
  }
  if(name.endsWith(".txt") || name.endsWith(".md")) return await file.text();
  throw new Error("For Word files, open the document, copy the text and paste it below.");
}

/* Heuristic extraction: fills the same profile shape the questions use. */
function extractProfile(text){
  const p = blankProfile();
  const L = lines(text);
  const e = text.match(emailRe); if(e){ p.email = e[0]; p.contact.email = e[0]; }
  const ph = text.match(phoneRe); if(ph) p.contact.phone = ph[1].trim();
  const links = [...text.matchAll(new RegExp(linkRe.source, "gi"))].map(m=>m[1].replace(/[.,)]+$/,""));
  p.contact.links = [...new Set(links)].filter(l=>!l.includes("@")).join("\n");
  const first = L.find(l => l.split(/\s+/).length <= 4 && !/\d|@|http/i.test(l));
  if(first) p.name = first;
  const heads = {
    edu: /^(education|academic|qualifications?|training)/i,
    work: /^(experience|work|employment|career|volunteer)/i,
    proj: /^(projects?)/i,
    skills: /^(skills?|technical skills|tools)/i,
    lang: /^(languages?)/i,
    awards: /^(awards?|achievements?|honours?|leadership)/i
  };
  const sections = {}; let cur = null;
  L.forEach(line => {
    const key = Object.keys(heads).find(k => heads[k].test(line) && line.split(/\s+/).length <= 4);
    if(key){ cur = key; sections[cur] = []; return; }
    if(cur) sections[cur].push(line);
  });
  if(sections.edu && sections.edu.length){
    p.education = [{ qual: sections.edu[0], institution: sections.edu[1]||"", study: "", start: "", end: "", grades: "" }];
  }
  if(sections.work && sections.work.length){
    p.work = [{ title: sections.work[0], org: sections.work[1]||"", start: "", end: "", responsibilities: sections.work.slice(2,5).join("\n"), contribution: "", outcome: "" }];
  }
  if(sections.proj && sections.proj.length){
    p.projects = [{ name: sections.proj[0], problem: "", contribution: sections.proj.slice(1,3).join(" "), tools: "", link: "" }];
  }
  if(sections.skills) p.skills = sections.skills.join(", ");
  if(sections.lang) p.languages = sections.lang.join("\n");
  if(sections.awards) p.awards = sections.awards.join("\n");
  return p;
}

/* ---------- Screens ---------- */
function renderNav(active = "profile"){
  const pages = [["tailor", "Tailor CV"], ["profile", "Base profile"], ["library", "Saved CVs"]];
  $("#location").textContent = state.user ? pages.find(([key]) => key === active)[1] : "Set up";
  $("#backup").hidden = !state.user;
  $("#navRow").innerHTML = state.user ? pages.map(([key, label]) =>
    `<button class="nav-item" data-act="${key}" ${key === active ? 'aria-current="page"' : ""}>${label}</button>`
  ).join("") : "";
}
function renderSignup(){
  renderNav();
  app().innerHTML = `
  <section class="hero">
    <h1>Set up your workspace</h1>
    <p>Add your contact details, then import an existing CV or build a profile from scratch.</p>
  </section>
  <form class="card stack" id="signupForm" novalidate>
    <h2>Contact details</h2>
    <div class="grid2">
      <label class="field">Full name
        <input id="su_name" required autocomplete="name" value="${esc(state.user?.name||"")}" placeholder="e.g. Thandi Mokoena">
      </label>
      <label class="field">Email address
        <input id="su_email" type="email" required autocomplete="email" value="${esc(state.user?.email||"")}" placeholder="you@example.com">
      </label>
    </div>
    <p class="hint" id="suErr" style="color:#b03a5b;font-weight:700"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" type="submit">Continue →</button></div>
  </form>`;
  $("#signupForm").addEventListener("submit", e=>{
    e.preventDefault();
    const name = $("#su_name").value.trim(), email = $("#su_email").value.trim();
    if(!name){ $("#suErr").textContent = "Please add the name you’d like on your CV."; return; }
    if(!emailRe.test(email)){ $("#suErr").textContent = "That email doesn’t look quite right. Please check it."; return; }
    state.user = { name, email, createdAt: new Date().toISOString() };
    state.profile.name = name; state.profile.email = email; state.profile.contact.email = email;
    store.set(KEY_USER, state.user);
    go(renderStart);
  });
}
function renderStart(){
  renderNav();
  app().innerHTML = `
  <section class="hero"><h1>Build your base profile</h1>
  <p>Use this profile as the source for each CV you tailor.</p></section>
  <div class="choice">
    <button data-start="upload"><b>Upload my CV</b><span>Import a PDF or text file and review the extracted details.</span></button>
    <button data-start="scratch"><b>Build from scratch</b><span>Enter your education, experience, projects and skills.</span></button>
  </div>`;
  app().querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
    if(b.dataset.start==="upload") go(renderUpload);
    else { state.profile = {...blankProfile(), name: state.user.name, email: state.user.email, contact:{...blankProfile().contact, email: state.user.email}}; state.step=0; go(renderWizard); }
  });
}
function renderUpload(){
  renderNav();
  app().innerHTML = `
  <section class="hero"><h1>Upload your CV</h1><p>Review the extracted details before adding them to your profile.</p></section>
  <div class="card stack">
    <label class="drop" id="drop" tabindex="0">
      <input id="cvFile" type="file" accept=".pdf,.txt,.md" hidden>

      <p><b>Drag your CV here</b> or tap to choose a file</p>
      <p class="hint">PDF (text-based), TXT or MD</p>
    </label>
    <details><summary style="cursor:pointer;font-weight:800">Or paste your CV text</summary>
      <textarea id="cvText" placeholder="Paste the text of your CV here…" style="margin-top:12px;min-height:160px"></textarea>
    </details>
    <p class="hint" id="upErr" style="color:#b03a5b;font-weight:700"></p>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="backStart">← Back</button>
      <button class="btn" id="scanBtn">Read CV</button>
    </div>
  </div>`;
  const drop = $("#drop"), input = $("#cvFile");
  const scan = async (text)=>{
    if(!text.trim()){ $("#upErr").textContent = "We couldn’t find text to read. Try pasting it instead."; return; }
    const found = extractProfile(text);
    state.profile = {...blankProfile(), ...found, name: found.name || state.user.name, email: state.user.email};
    state.profile.contact.email = found.contact.email || state.user.email;
    state.fromCv = true; state.step = 0; toast("CV imported. Review the extracted details.");
    go(renderWizard);
  };
  const handleFile = async f => {
    $("#upErr").textContent = "";
    try{ scan(await readFileText(f)); }
    catch(err){ $("#upErr").textContent = err.message; }
  };
  drop.onclick = ()=> input.click();
  drop.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
  input.onchange = ()=> input.files[0] && handleFile(input.files[0]);
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop", e=> e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]));
  $("#scanBtn").onclick = ()=>{ const f = input.files[0]; f ? handleFile(f) : scan($("#cvText").value); };
  $("#backStart").onclick = ()=> go(renderStart);
}

/* ---------- Guided questions (25 questions in 4 steps) ---------- */
const EDU_F = [
  ["qual","Which qualification have you completed or are you pursuing?","e.g. BSc Computer Science"],
  ["institution","Which institution did you attend?","e.g. University of the Witwatersrand"],
  ["study","What did you study?","e.g. Information Systems"],
  ["start","When did you start?","e.g. Feb 2021"],
  ["end","When did you finish, or when do you expect to finish?","e.g. Nov 2024 or Expected 2027"],
  ["grades","Any grades, distinctions or academic honours?","e.g. Cum laude"]
];
const WORK_F = [
  ["title","What was your title?","e.g. Junior Data Analyst"],
  ["org","Which organisation was it with?","e.g. Standard Bank"],
  ["dates","When were you there?","e.g. Jan 2025 – Present"],
  ["responsibilities","What were your main responsibilities?","One per line works well"],
  ["contribution","What did you personally build, deliver, improve or solve?","Use your own actions"],
  ["outcome","What was the outcome? Include numbers if you have them.","e.g. Cut report time by 40%"]
];
const PROJ_F = [
  ["name","What personal, academic or team project would you like to showcase?","e.g. Campus room booking app"],
  ["problem","What problem did it address?",""],
  ["contribution","What did you contribute?",""],
  ["tools","What tools, technologies or methods did you use?","e.g. Python, Flask, SQLite"],
  ["link","Is there a link where someone can see your work?","https://github.com/you/project"]
];
const STEPS = [
  {title:"Contact", tag:"Compulsory"},
  {title:"Education & training", tag:"Compulsory"},
  {title:"Work & volunteering", tag:"Suggested"},
  {title:"Projects & skills", tag:"Suggested"}
];
const fieldHtml = (path, label, ph="", type="text", value="") => `
  <label class="field">${label}
    <input type="${type}" data-path="${path}" placeholder="${esc(ph)}" value="${esc(value)}">
  </label>`;
function entryBlock(arrKey, idx, fields, entry){
  return `<div class="entry" data-entry="${arrKey}:${idx}">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="pill mint">Entry ${idx+1}</span>
      <button class="btn danger small" type="button" data-remove="${arrKey}:${idx}">Remove</button>
    </div>
    <div class="stack" style="margin-top:0">
    ${fields.map(([k,label,ph])=>{
      const isLong = ["responsibilities","contribution","outcome","problem","grades"].includes(k) && k!=="grades";
      const val = entry?.[k] ?? "";
      return isLong
        ? `<label class="field">${label}<textarea data-path="${arrKey}.${idx}.${k}" placeholder="${esc(ph)}">${esc(val)}</textarea></label>`
        : fieldHtml(`${arrKey}.${idx}.${k}`, label, ph, "text", val);
    }).join("")}
    </div></div>`;
}
function stepHtml(i){
  const p = state.profile;
  const fromCv = state.fromCv ? `<span class="pill">Found in your CV — please check each answer</span>` : "";

function readStepIntoProfile(){
  const body = $("#stepBody");
  body.querySelectorAll("[data-path]").forEach(el=>{
    const path = el.dataset.path;
    const val = el.dataset.bool !== undefined ? el.checked : el.value;
    setPath(state.profile, path, val);
  });
}
function setPath(obj, path, val){
  const keys = path.split(".");
  let o = obj;
  keys.slice(0,-1).forEach((k,n)=>{
    const nextIsIndex = /^\d+$/.test(keys[n+1]);
    if(o[k]===undefined) o[k] = nextIsIndex ? [] : {};
    o = o[k];
  });
  const last = keys[keys.length-1];
  if(/^\d+$/.test(last)) o[last]=val; else o[last]=val;
}
function bindWizard(){
  const body = $("#stepBody");
  body.addEventListener("click", e=>{
    const add = e.target.closest("[data-add]"); const rem = e.target.closest("[data-remove]");
    if(add||rem){
      readStepIntoProfile();
      if(add){
        const k = add.dataset.add;
        state.profile[k].push(k==="education"?{qual:"",institution:"",study:"",start:"",end:"",grades:""}:k==="work"?{title:"",org:"",dates:"",responsibilities:"",contribution:"",outcome:""}:{name:"",problem:"",contribution:"",tools:"",link:""});
      }else{
        const [k,idx] = rem.dataset.remove.split(":");
        state.profile[k].splice(Number(idx),1);
      }
      $("#stepBody").innerHTML = stepHtml(state.step);
      toast(add ? "Added a new entry" : "Entry removed");
    }
  });
  body.addEventListener("change", e=>{
    if(e.target.matches("[data-bool]")){ state.profile.noEducation = e.target.checked; $("#eduBox").hidden = e.target.checked; }
  });
  $("#prevBtn").onclick = ()=>{ readStepIntoProfile(); state.step--; go(renderWizard); };
  const skip = $("#skipBtn"); if(skip) skip.onclick = ()=>{ state.step++; go(renderWizard); };
  $("#nextBtn").onclick = ()=>{
    readStepIntoProfile();
    const err = validateStep(state.step);
    if(err){ $("#wizErr").textContent = err; $("#stepBody").scrollIntoView({behavior:"smooth"}); return; }
    if(state.step < STEPS.length-1){ state.step++; go(renderWizard); }
    else {
      if(!store.set(KEY_PROFILE, state.profile)){ toast("Couldn’t save the profile in this browser."); return; }
      state.fromCv = false;
      go(renderChoose);
    }
  };
}
function validateStep(i){
  const p = state.profile;
  if(i===0){
    if(!p.name.trim()) return "Please add the name for your CV.";
    if(!emailRe.test(p.contact.email||"")) return "Please add a valid email for employers.";
    if(!p.contact.phone.trim()) return "Please add a phone number.";
    if(!p.contact.location.trim()) return "Please add your city, region and country.";
  }
  if(i===1 && !p.noEducation){
    const e0 = p.education[0];
    if(!e0 || !e0.qual.trim() || !e0.institution.trim()) return "Please add at least one qualification and institution, or tick “I don’t have any education” to continue.";
  }
  return "";
}

/* ---------- Job description matching (runs in the browser) ---------- */
function evidenceItems(p){
  const items = [];
  p.work.forEach((w,i)=> items.push({kind:"work", idx:i, text:[w.title,w.org,w.responsibilities,w.contribution,w.outcome].join(" ")}));
  p.projects.forEach((pr,i)=> items.push({kind:"projects", idx:i, text:[pr.name,pr.problem,pr.contribution,pr.tools].join(" ")}));
  return items;
}
function tailorProfile(p, jd){
  const jdKeys = Object.entries(keywords(jd)).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  const top = jdKeys.slice(0,30);
  const topSet = new Set(top);
  const scored = evidenceItems(p).map(it=>{
    const words = new Set(Object.keys(keywords(it.text)));
    const score = [...words].filter(w=>topSet.has(w)).length;
    return {...it, score};
  });
  const order = (kind, n) => scored.filter(s=>s.kind===kind).sort((a,b)=>b.score-a.score).map(s=>s.idx);
  const skillList = lines(p.skills.replace(/,/g,"\n")).map(s=>s.trim()).filter(Boolean);
  const hitSkills = skillList.filter(s=>Object.keys(keywords(s)).some(w=>topSet.has(w)));
  const allText = JSON.stringify(p).toLowerCase();
  const gaps = top.filter(w=>!allText.includes(w)).slice(0,8);
  const matched = top.filter(w=>allText.includes(w)).slice(0,14);
  return {
    workOrder: order("work"), projectOrder: order("projects"),
    skills: [...hitSkills, ...skillList.filter(s=>!hitSkills.includes(s))],
    matched, gaps, hl: new Set(matched)
  };
}

  <nav class="steps" aria-label="Tailoring workflow">

}

/* ---------- CV rendering ---------- */
const hl = (text, set) => set && set.size ? esc(text).replace(new RegExp("\\b(" + [...set].map(w=>w.replace(/[.*+?^${}()|[\]\\\-]/g,"\\$&")).join("|") + ")\\b","gi"), '<span class="hl">$1</span>') : esc(text);
const bullets = (text, set) => lines(text).length ? `<ul>${lines(text).map(l=>`<li>${hl(l,set)}</li>`).join("")}</ul>` : "";
function cvHtml(p, theme, tailored){
  const set = tailored?.hl;
  const c = p.contact;
  const work = tailored ? tailored.workOrder.map(i=>p.work[i]) : p.work;
  const projects = tailored ? tailored.projectOrder.map(i=>p.projects[i]) : p.projects;
  const skills = tailored ? tailored.skills : lines(p.skills.replace(/,/g,"\n"));
  const linkList = lines(c.links);
  const section = (title, body) => body ? `<h2>${title}</h2>${body}` : "";
  return `<article class="cv t-${theme}">
    <header><h1>${esc(p.name)}</h1>
      <div class="meta">${[c.email,c.phone,c.location].filter(Boolean).map(esc).join(" · ")}</div>
      ${linkList.length?`<div class="meta">${linkList.map(esc).join(" · ")}</div>`:""}
    </header>
    ${section("Education & training", p.noEducation ? "" : p.education.filter(e=>e.qual).map(e=>`<div class="item"><b>${esc(e.qual)}</b>${e.institution?` — ${esc(e.institution)}`:""}${e.study?`<div class="sub">${esc(e.study)}</div>`:""}<div class="sub">${[e.start,e.end].filter(Boolean).map(esc).join(" – ")}${e.grades?` · ${esc(e.grades)}`:""}</div></div>`).join("") + bullets(p.certs))}
    ${section("Experience", work.filter(w=>w.title).map(w=>`<div class="item"><b>${hl(w.title,set)}</b>${w.org?` — ${esc(w.org)}`:""}<div class="sub">${esc(w.dates||"")}</div>${bullets([w.responsibilities,w.contribution,w.outcome].filter(Boolean).join("\n"),set)}</div>`).join(""))}
    ${section("Projects", projects.filter(x=>x.name).map(x=>`<div class="item"><b>${hl(x.name,set)}</b>${x.tools?`<div class="sub">${hl(x.tools,set)}</div>`:""}${bullets([x.problem,x.contribution].filter(Boolean).join("\n"),set)}${x.link?`<div class="sub">${esc(x.link)}</div>`:""}</div>`).join(""))}
    ${section("Skills", skills.length ? skills.map(s=>`<span class="chip">${hl(s,set)}</span>`).join("") : "")}
    ${section("Languages", bullets(p.languages))}
    ${section("Awards & leadership", bullets(p.awards))}
  </article>`;
}

/* ---------- Preview, themes, save, download ---------- */
function atsText(p, tailored){
  const work = tailored ? tailored.workOrder.map(i=>p.work[i]) : p.work;
  const projects = tailored ? tailored.projectOrder.map(i=>p.projects[i]) : p.projects;
  const skills = tailored ? tailored.skills : lines(p.skills.replace(/,/g,"\n"));
  const out = [];
  out.push(p.name.toUpperCase());
  out.push([p.contact.email,p.contact.phone,p.contact.location,...lines(p.contact.links)].filter(Boolean).join(" | "));
  if(!p.noEducation && p.education.some(e=>e.qual)){
    out.push("", "EDUCATION");
    p.education.filter(e=>e.qual).forEach(e=>{ out.push(`${e.qual}${e.institution?", "+e.institution:""}`); const meta=[e.study,[e.start,e.end].filter(Boolean).join(" - "),e.grades&&`Grades: ${e.grades}`].filter(Boolean).join(" | "); if(meta) out.push(meta); });
    lines(p.certs).forEach(c=>out.push(`- ${c}`));
  }
  if(work.some(w=>w.title)){
    out.push("", "EXPERIENCE");
    work.filter(w=>w.title).forEach(w=>{ out.push(`${w.title} | ${w.org} | ${w.dates||""}`); [w.responsibilities,w.contribution,w.outcome].filter(Boolean).join("\n").split("\n").filter(Boolean).forEach(l=>out.push(`- ${l}`)); out.push(""); });
  }
  if(projects.some(x=>x.name)){
    out.push("PROJECTS");
    projects.filter(x=>x.name).forEach(x=>{ out.push(`${x.name}${x.tools?` (${x.tools})`:""}`); [x.problem,x.contribution].filter(Boolean).forEach(l=>out.push(`- ${l}`)); if(x.link) out.push(x.link); });
    out.push("");
  }
  if(skills.length){ out.push("SKILLS", skills.join(", "), ""); }
  if(p.languages.trim()){ out.push("LANGUAGES", ...lines(p.languages).map(l=>`- ${l}`), ""); }
  if(p.awards.trim()){ out.push("AWARDS", ...lines(p.awards).map(l=>`- ${l}`)); }
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim() + "\n";
}
function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

      <div><b style="font-family:var(--display);font-size:1.15rem">${esc(r.title)}</b>
        <div class="hint">${r.tailored?`Tailored${r.jobTitle?` · ${esc(r.jobTitle)}`:""}`:"Standard CV"} · ${new Date(r.updatedAt).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"})}</div></div>
      <div class="btns">
        <button class="btn small" data-open="${r.id}">Open</button>
        <button class="btn ghost small" data-del="${r.id}">Remove</button>
      </div>
    </div>`).join("")}</div>`
    : `<div class="card" style="text-align:center"><h2>No CVs yet</h2><p class="hint" style="margin:8px 0 18px">Your saved CVs will appear here.</p><button class="btn" id="makeOne">Create my first CV</button></div>`;
  app().innerHTML = `
  <section class="hero"><h1>Saved CVs</h1><p>Open, download or remove any CV you’ve saved in this browser.</p></section>
  <div class="card stack">
    <div class="row" style="justify-content:space-between"><h2>CV library</h2><button class="btn small" id="newBtn">+ New CV</button></div>
    ${body}
  </div>`;
  app().querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCv(b.dataset.open));
  app().querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.arm){ removeCv(b.dataset.del); return; }
    b.dataset.arm="1"; b.textContent="Select again to remove"; b.classList.add("danger");
  });
  const mk = $("#makeOne"); if(mk) mk.onclick = ()=> go(restartFlow);
  $("#newBtn").onclick = ()=> go(restartFlow);
}
function restartFlow(){
  state.profile = {...blankProfile(), name: state.user.name, email: state.user.email, contact:{...blankProfile().contact, email: state.user.email}};
  state.tailored = null; state.currentCv = null; state.fromCv = false; state.step = 0;
  state.tailorJD = ""; state.jobTitle = ""; state.jobCompany = ""; state.draftTitle = null;
  renderStart();
}

/* ---------- Startup & navigation ---------- */
function openBaseProfile(){
  const profile = store.get(KEY_PROFILE, null);
  if(!profile){ go(renderStart); return; }
  state.profile = profile;
  state.step = 0;
  state.fromCv = false;
  state.tailored = null;
  state.currentCv = null;
  go(renderWizard);
}
document.addEventListener("click", e=>{
  const panel = e.target.closest("[data-panel]")?.dataset.panel;
  if(panel){
    if($("#cvTitle")) state.draftTitle = $("#cvTitle").value;
    go({job:renderJob,match:renderMatch,preview:renderPreview,compare:renderCompare}[panel]);
    return;
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if(act==="library") go(renderLibrary);
  if(act==="profile") openBaseProfile();
  if(act==="tailor"){
    const profile = store.get(KEY_PROFILE, null);
    if(!profile){ go(renderStart); return; }
    if(state.currentCv){ state.tailored = null; state.currentCv = null; state.draftTitle = null; }
    state.profile = profile;
    go(renderJob);
  }
  if(act==="backup"){
    const backup = {profile:store.get(KEY_PROFILE,null), savedCVs:store.get(KEY_CVS,[])};
    downloadFile("tailormycv-backup.json", JSON.stringify(backup,null,2), "application/json");
  }
});
(function init(){
  state.user = store.get(KEY_USER, null);
  if(!state.user){ renderSignup(); return; }
  const profile = store.get(KEY_PROFILE, null);
  if(profile){ state.profile = profile; renderJob(); return; }
  state.profile.name = state.user.name; state.profile.email = state.user.email; state.profile.contact.email = state.user.email;
  const saved = store.get(KEY_CVS, []);
  saved.length ? renderLibrary() : renderStart();
})();
</script>
</body>
</html>
